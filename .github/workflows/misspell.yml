# Поиск опечаток в коде, комментариях и документации.
#
# Использует reviewdog + misspell — оставляет inline-комментарии
# прямо в diff PR, указывая на конкретную строку с опечаткой.
# На push в main просто фейлится при наличии опечаток.

name: Misspell

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  misspell:
    name: Check spelling
    runs-on: ubuntu-latest

    steps:
      - name: Reuse verified CI
        id: verified
        uses: aimuzov/infra-ci/reuse-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/misspell.yml
      - uses: actions/checkout@v6
        if: steps.verified.outputs.reused != 'true'

      # reviewdog/action-misspell:
      # - Сканирует все текстовые файлы в репозитории
      # - На PR: оставляет inline-комментарии с предложениями исправлений
      # - На push: выводит ошибки в лог
      # - locale: US — проверяет по американскому английскому
      - uses: reviewdog/action-misspell@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          locale: US
          level: warning
          # Пропускать бинарные и сгенерированные файлы
          exclude: |
            .git/*
            node_modules/*
            *.png
            *.jpg
            *.gif
            *.ico
        if: steps.verified.outputs.reused != 'true'
      - name: Record verified CI
        if: github.event_name == 'pull_request' && steps.verified.outputs.reused != 'true'
        uses: aimuzov/infra-ci/record-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/misspell.yml
