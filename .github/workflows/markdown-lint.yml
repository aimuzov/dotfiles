# Линтинг Markdown-документации.
#
# Проверяет: последовательность заголовков, пустые строки вокруг блоков кода,
# корректность списков, длину строк и другие правила форматирования.
# Конфигурация: .markdownlint.yml (создаётся в этом же коммите).

name: Markdown Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Reuse verified CI
        id: verified
        uses: aimuzov/infra-ci/reuse-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/markdown-lint.yml
      - uses: actions/checkout@v6
        if: steps.verified.outputs.reused != 'true'

      # avto-dev/markdown-lint — запускает markdownlint-cli в Docker.
      # fix: false — только проверка, без автоисправления.
      # config: путь к конфигу с правилами.
      - uses: avto-dev/markdown-lint@v1
        with:
          args: "**/*.md"
          config: ".markdownlint.yml"
        if: steps.verified.outputs.reused != 'true'
      - name: Record verified CI
        if: github.event_name == 'pull_request' && steps.verified.outputs.reused != 'true'
        uses: aimuzov/infra-ci/record-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/markdown-lint.yml
permissions:
  contents: read
  actions: read
  id-token: write
