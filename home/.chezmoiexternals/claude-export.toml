# Выгрузка экспорта данных claude.ai по манифесту: свой репозиторий
# github.com/aimuzov/claude-export. Куда класть бэкапы -- CLAUDE_EXPORT_DEST в config.fish
[".local/bin/claude-export"]
type = "file"
url = "https://raw.githubusercontent.com/aimuzov/claude-export/main/bin/claude-export"
executable = true
refreshPeriod = "168h"

[".config/fish/completions/claude-export.fish"]
type = "file"
url = "https://raw.githubusercontent.com/aimuzov/claude-export/main/completions/claude-export.fish"
refreshPeriod = "168h"
